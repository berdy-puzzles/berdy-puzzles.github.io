<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>?</title>
<style>
  :root { --ink: #2b1d4f; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
         font-family: "Arial Rounded MT Bold", system-ui, sans-serif; color: var(--ink);
         background: linear-gradient(120deg, #ff5f6d, #ffb347, #f9f871, #5ee7a0, #4facfe,
         #a66cff, #ff5f6d); background-size: 400% 400%; animation: drift 12s ease infinite; }
  @keyframes drift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; }
                     100% { background-position: 0% 50%; } }
  main { background: rgba(255, 255, 255, 0.82); border-radius: 28px; padding: 2rem 2.5rem;
         box-shadow: 0 10px 40px rgba(43, 29, 79, 0.25); max-width: 30rem; }
  #grid { display: grid; grid-template-columns: repeat(3, 4.2rem); margin: 0 auto 1.4rem;
          width: max-content; border: 4px solid var(--ink); border-radius: 8px; overflow: hidden; }
  #grid div { height: 4.2rem; display: grid; place-items: center; font-size: 2.1rem;
              font-weight: 900; border: 1px solid var(--ink); transition: background 0.15s; }
  #line { font-size: 1.5rem; min-height: 2em; margin: 0.3rem 0; }
  .small { font-size: 0.95rem; opacity: 0.75; }
  a { color: var(--ink); }
</style>
</head>
<body>
<main>
<div id="grid"></div>
<p id="line">…</p>
<p class="small"><a href="https://logic-masters.de/Raetselportal/Benutzer/eingestellt.php?name=berdy">Lost? Everything by berdy is here.</a></p>
<noscript><p>This page needs JavaScript; the link above has everything.</p></noscript>
</main>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const debug = params.has("debug");
  const puzzleUrl = (id) => "https://logic-masters.de/Raetselportal/Raetsel/zeigen.php?id={id}".replace("{id}", id);
  const colours = ["#ff5f6d", "#ffb347", "#f9f871", "#5ee7a0", "#4facfe", "#a66cff",
                   "#ff7eb3", "#7afcff", "#ffd36e"];
  const grid = document.getElementById("grid");
  const cells = [...Array(9)].map(() => grid.appendChild(document.createElement("div")));
  const shuffle = () => cells.forEach((cell) => {
    cell.style.background = colours[Math.floor(Math.random() * colours.length)];
    cell.textContent = 1 + Math.floor(Math.random() * 9);
  });
  const REVEAL = 400;  // ms the chosen title shows before the redirect
  const spin = setInterval(shuffle, 90);
  shuffle();
  const data = await (await fetch("choices.json", {cache: "no-store"})).json();
  const all = data.choices.map((entry) => {
    const [id, ...title] = entry.split(":");
    return {id, title: title.join(":")};
  });
  // Not the puzzle the visitor just came from, when there is anything else.
  const came = params.get("from") || (document.referrer.match(/id=([0-9A-Z]{6})/) || [])[1];
  const pool = all.length > 1 ? all.filter((c) => c.id !== came) : all;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  const wait = 1000 * Number(params.get("wait") ?? data.opts.wait_secs ?? 1);
  const line = document.getElementById("line");
  line.textContent = "Something is on its way…";
  setTimeout(() => {
    clearInterval(spin);
    cells.forEach((cell, k) => {
      cell.style.background = k === 4 ? "#fff" : colours[k];
      cell.textContent = k === 4 ? "?" : "";
    });
    line.textContent = pick.title;
    if (debug) { line.textContent += ` (${pick.id}, debug)`; return; }
    setTimeout(() => location.replace(puzzleUrl(pick.id)), REVEAL);
  }, Math.max(0, wait - REVEAL));
})();
</script>
</body>
</html>
